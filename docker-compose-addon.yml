# letheClaw Services - Add these to your existing docker-compose.yml
# Only the API is exposed to the host (port 51234). Postgres, Qdrant, Redis, embeddings
# are internal and reachable only via the Docker network.

  # =============================================================================
  # letheClaw Memory System
  # =============================================================================

  # PostgreSQL - Memory metadata storage (internal)
  letheclaw-postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=letheclaw
      - POSTGRES_USER=letheclaw
      - POSTGRES_PASSWORD=letheclaw_pass
    volumes:
      - letheclaw-postgres-data:/var/lib/postgresql/data
      - /c/GithubProjects/persoclaw/openclaw-data/workspace/letheclaw/schema:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U letheclaw"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Qdrant - Vector embeddings for semantic search
  letheclaw-qdrant:
    image: qdrant/qdrant:v1.7.4
    volumes:
      - letheclaw-qdrant-data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis - Hot cache for recent memories
  letheclaw-redis:
    image: redis:7-alpine
    volumes:
      - letheclaw-redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Python embedding service
  letheclaw-embeddings:
    build:
      context: /c/GithubProjects/persoclaw/openclaw-data/workspace/letheclaw/embeddings
      dockerfile: Dockerfile
    environment:
      - MODEL=sentence-transformers/all-MiniLM-L6-v2
      - DEVICE=cpu
      - PORT=5000
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5000/health\")' || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # Main letheClaw API
  letheclaw-api:
    build:
      context: /c/GithubProjects/persoclaw/openclaw-data/workspace/letheclaw/api
      dockerfile: Dockerfile
    ports:
      - "51234:8080"  # Host port in dynamic range 49152-65535 to avoid conflicts
    environment:
      - DATABASE_URL=postgresql://letheclaw:letheclaw_pass@letheclaw-postgres:5432/letheclaw?sslmode=disable
      - REDIS_URL=redis://letheclaw-redis:6379/0
      - QDRANT_URL=http://letheclaw-qdrant:6333
      - EMBEDDING_PROVIDER=python-sidecar
      - EMBEDDING_ENDPOINT=http://letheclaw-embeddings:5000
      - LOG_LEVEL=info
    depends_on:
      - letheclaw-postgres
      - letheclaw-redis
      - letheclaw-qdrant
      - letheclaw-embeddings
    volumes:
      - /c/GithubProjects/persoclaw/openclaw-data/workspace/letheclaw/config:/app/config:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# Add these volumes at the end of your docker-compose.yml
volumes:
  letheclaw-postgres-data:
    driver: local
  letheclaw-qdrant-data:
    driver: local
  letheclaw-redis-data:
    driver: local
